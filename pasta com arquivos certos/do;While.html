<!--Abrindo a tag principal da página-->
<html>
<head>

      <title>Teste seu código HTML</title>
      <meta charset = "UTF-8">
      <meta name="Autor" content="Fábio Borges de Oliveira">

</head>
<!--Abrindo a tag body da página principal, colocando a cor cinza para o corpo da página-->
<body bgcolor="#CCCCCC">
       <!--Centralizar o formulário que conterá um componente text-->
       <center>
       <!--Formulário que conterá um componente textarea que, por sua vez
           permitirá inserir os códigos que serão visualizados e executados 
           na página.-->
       <form>
            <br>
            <!--Abrindo o componente textarea que, por sua vez, conterá
            os elementos que serão visualizados e executados na página.-->
            <textarea name="fonte" cols="70" rows="20">
                <!DOCTYPE html>
                <html lang="pt-br">
                  <head>
                    <meta charset="UTF-8" />
                    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
                    <title>Atividade Exemplo doWhile</title>
                    <link rel="stylesheet" href="./css/style.css" />
                  </head>
                  <header>
                    <h1>do;While</h1>
                  </header>
                  <body>
                    <h1>Menu de Seleção
                    </h1>
                    <form action="#" method="get">
                      <fieldset class="cadbasico">
                        <legend>valor</legend>
                        <button type="submit" id="botao">Enviar</button>
                      </fieldset>
                    </form>
                    <script src="./js/script.js"></script>
                  </body>
                </html>
                
                 <!-- CSS da pagina -->
                  
                 <style>
                    
                  section {
                    margin-top: 0px auto;
                  }
                  
                  .cadbasico {
                    width: 300px;
                    margin: 0px auto;
                    font-weight: bold;
                    margin-bottom: 10px;
                  }
                  
                  .cadbasico input {
                    margin: 5px auto;
                    width: 100%;
                    padding: 5px 0;
                  }
                  
                  .cadbasico button {
                    width: 30%;
                    background-color: #b1ccf5;
                    font-weight: bold;
                    font-size: 16px;
                  }
                  
                  label {
                    float: left;
                  }
                  
                  h1 {
                    text-align: center;
                    margin-top: 0px;
                    margin-bottom: 10px;
                    font-size: 50px;
                  }
                  
                  h2 {
                    text-align: center;
                    margin-top: 0px;
                    margin-bottom: 10px;
                    font-size: 25px;
                  }
                  
                  header {
                    display: flex;
                    font: bold 20px Arial, Helvetica, sans-serif;
                    background-color: blue;
                    color: white;
                  }
                  
                  </style>
                
                 <!-- Script da Página -->
                  
                  <script>
                    function fazer() {
                  let resposta;
                  do {
                    resposta = Number(
                      prompt(`MENU:\n 1 - aaa \n 2 - bbb \n 3 - ccc \n 0 - Encerrar programa`)
                    );
                    if (resposta < 0 || resposta > 3){
                      alert("digite o valor correto")
                    }
                  } while (resposta !== 0);
                
                  alert(`Resposta ok`);
                }
                
                botao = document.getElementById("botao");
                botao.addEventListener("click", fazer);
                
                  </script>

            </textarea><!--Finalizando o componente textarea-->
            <br><br>
            <input type="button" value="Testar sua página" onclick="document.write(fonte.value);"> 

       </form>


       </center>

</body><!--Finalizando a tag body da página principal-->
      





</html><!--Fechando a tag principal da página-->
