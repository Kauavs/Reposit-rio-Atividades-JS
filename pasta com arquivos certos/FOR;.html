<!--Abrindo a tag body da página principal, colocando a cor cinza para o corpo da página-->

<body bgcolor="#CCCCCC">
  <!--Centralizar o formulário que conterá um componente text-->
  <center>
    <!--Formulário que conterá um componente textarea que, por sua vez
           permitirá inserir os códigos que serão visualizados e executados 
           na página.-->
    <form>
      <br>
      <!--Abrindo o componente textarea que, por sua vez, conterá
            os elementos que serão visualizados e executados na página.-->
      <textarea name="fonte" cols="70" rows="20">
                <!DOCTYPE html>
                <html lang="pt-br">
                <!-- HTML da Página -->
                <head>
                  <meta charset="UTF-8" />
                  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
                  <title>SomaX</title>
                </head>
                <header>
                  <h1>For</h1>
                </header>
                
                <body>
                  <h1>Soma de Números pares Até (X) Valor</h1>
                  <form action="#" method="get">
                    <fieldset class="cadbasico">
                      <legend>Entrada de dados</legend>
                      <button type="submit" id="botao">Enviar</button>
                    </fieldset>
                  </form>
                </body>
                
                </html>
                
                <!--CSS Da Página-->
                <style>
                  section {
                    margin-top: 0px auto;
                  }
                
                  .cadbasico {
                    width: 300px;
                    margin: 0px auto;
                    font-weight: bold;
                    margin-bottom: 10px;
                  }
                
                  .cadbasico input {
                    margin: 5px auto;
                    width: 100%;
                    padding: 5px 0;
                  }
                
                  .cadbasico button {
                    width: 30%;
                    background-color: #b1ccf5;
                    font-weight: bold;
                    font-size: 16px;
                  }
                
                  label {
                    float: left;
                  }
                
                  h1 {
                    text-align: center;
                    margin-top: 0px;
                    margin-bottom: 10px;
                    font-size: 50px;
                  }
                
                  h2 {
                    text-align: center;
                    margin-top: 0px;
                    margin-bottom: 10px;
                    font-size: 25px;
                  }
                
                  header {
                    display: flex;
                    font: bold 20px Arial, Helvetica, sans-serif;
                    background-color: blue;
                    color: white;
                  }
                </style>
                
                <!-- Código da Página  -->
                
                <script>
                  function tabuadapar() {
                    let numero = Number(
                      prompt(
                        "Digite um número para ver a soma dos numeros de todos os numeros pares até ele"
                      )
                    );


                    if (numero == " ") {
                      alert("Digite um número válido");
                      return;
                    }
                    let resultado = 0;
                    for (let i = 0; i <= numero; i++) {
                      if (i % 2 === 0) {
                        resultado += i;
                      }
                    }
                    alert("A soma dos numeros pares existentes até " + numero + " é: " + resultado);
                  }
                  botao = document.getElementById("botao");
                  botao.addEventListener("click", tabuadapar);
                </script>

            </textarea><!--Finalizando o componente textarea-->
      <br><br>
      <input type="button" value="Testar sua página" onclick="document.write(fonte.value);">

    </form>
