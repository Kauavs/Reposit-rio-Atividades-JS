<!--Abrindo a tag body da página principal, colocando a cor cinza para o corpo da página-->
<body bgcolor="#CCCCCC">
    <h1 style="text-align: center;">Este Sistema Criara aleatoriamente uma matriz 5x5 e automaticamente multiplicará o valor obtido em cada posição
        por DOIS.</h1>

       <!--Centralizar o formulário que conterá um componente text-->
       <center>
       <!--Formulário que conterá um componente textarea que, por sua vez
           permitirá inserir os códigos que serão visualizados e executados 
           na página.-->
       <form>
            <br>
            <!--Abrindo o componente textarea que, por sua vez, conterá
            os elementos que serão visualizados e executados na página.-->
            <textarea name="fonte" cols="70" rows="20">
                <!DOCTYPE html>
                <html lang="en">
                
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Valida</title>
                </head>
                
                <body>
                    <header>
                        <h1> Matrizes </h1>
                    </header>
                    <h1>Auto-Multiplicador</h1>
                    <h2>Este Sistema Criara aleatoriamente uma matriz 5x5 e automaticamente multiplicará o valor obtido em cada posição
                        por DOIS </h2>
                    <form action="#" method="get" name="frmcaso">
                        <fieldset class="cadbasico">
                            <legend>Botão Inciador</legend>
                            <button type="submit" id="botao">Enviar</button>
                            <button type="button" onclick="window.location.reload()">Voltar</button>

                        </fieldset>
                    </form>
                </body>
                
                </html>
                
                <!-- CSS da pagina -->
                
                <style>
                    section {
                        margin-top: 0px auto;
                    }
                
                    .cadbasico {
                        width: 300px;
                        margin: 0px auto;
                        font-weight: bold;
                        margin-bottom: 10px;
                    }
                
                    .cadbasico input {
                        margin: 5px auto;
                        width: 100%;
                        padding: 5px 0;
                    }
                
                    .cadbasico button {
                        width: 30%;
                        background-color: #b1ccf5;
                        font-weight: bold;
                        font-size: 16px;
                    }
                
                    label {
                        float: left;
                    }
                
                    h1 {
                        text-align: center;
                        margin-top: 0px;
                        margin-bottom: 10px;
                        font-size: 50px;
                    }
                
                    h2 {
                        text-align: center;
                        margin-top: 0px;
                        margin-bottom: 10px;
                        font-size: 25px;
                    }
                
                    header {
                        display: flex;
                        font: bold 20px Arial, Helvetica, sans-serif;
                        background-color: blue;
                        color: white;
                    }
                
                    h4,
                    h6 {
                        text-align: center;
                        margin-top: 0px;
                        margin-bottom: 10px;
                
                    }
                </style>
                
                <!-- Codigo da Página  -->
                
                <script>
                    function matrizes(e) {
                
                        e.preventDefault()
                
                        matriz = []
                        matriznova = []
                        let linhas = 5
                        let colunas = 5
                
                        for (let i = 0; i < linhas; i++) {
                            matriz[i] = []
                            for (let j = 0; j < colunas; j++) {
                                matriz[i][j] = Math.floor(Math.random() * 20)
                            }
                        }
                
                        for (let i = 0; i < linhas; i++) {
                            matriznova[i] = []
                            for (let j = 0; j < colunas; j++) {
                                matriznova[i][j] = matriz[i][j] * 2
                            }
                        }
                
                        //printss
                
                        document.write("<h3>Matriz Original</h1>");
                
                        for (let i = 0; i < linhas; i++) {
                            for (let j = 0; j < colunas; j++) {
                                document.write(matriz[i][j] + "&nbsp&nbsp");
                
                            }
                            document.write("<br>");
                
                        }
                        document.write("<br>");
                        document.write("<br>");
                
                        document.write("<h3>Matriz Nova</h1>");
                        for (let i = 0; i < linhas; i++) {
                            for (let j = 0; j < colunas; j++) {
                                document.write(matriznova[i][j] + "&nbsp&nbsp");
                
                            }
                            document.write("<br>");
                        }
                        document.write("<br><br>");
                        document.write("<button onclick=\"location.reload()\">Voltar</button>");
                
                
                
                    }
                
                    let botao = document.getElementById("botao");
                    botao.addEventListener("click", matrizes);
                </script>

            </textarea><!--Finalizando o componente textarea-->
            <br><br>
            <input type="button" value="Testar sua página" onclick="document.write(fonte.value);">
            <input type="button" value="Voltar" onclick="history.back()">

       </form>
