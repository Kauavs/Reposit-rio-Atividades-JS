                <!DOCTYPE html>

                <!-- Script da Página -->
                <script>
                    function vetores(e) {


                        let valor1 = [];
                        let valor2 = [];
                        let valor3 = [];
                        let i;

                        for (i = 0; i < 3; i++) {
                            valor1[i] = Number(prompt(`Digite valor do indice ${i + 1} do vetor 1`));
                            valor2[i] = Number(prompt(`Digite valor do indice ${i + 1} do vetor 2`));
                        }

                        for (i = 0; i < 3; i++) {
                            valor3[i] = valor1[i] + valor2[i];
                        }

                        for (i = 0; i < 3; i++) {
                            console.log(`${valor1[i]} + ${valor2[i]} = ${valor3[i]}`);
                        }
                    }

                    botao = document.getElementById("botao");
                    botao.addEventListener("click", vetores);
                </script>
