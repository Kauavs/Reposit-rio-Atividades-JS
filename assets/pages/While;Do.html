<!--Abrindo a tag body da página principal, colocando a cor cinza para o corpo da página-->
<body bgcolor="#CCCCCC">
  <h1 style="text-align: center;">Descubra o Número aleatório de 0 a 10.</h1>

       <!--Centralizar o formulário que conterá um componente text-->
       <center>
       <!--Formulário que conterá um componente textarea que, por sua vez
           permitirá inserir os códigos que serão visualizados e executados 
           na página.-->
       <form>
            <br>
            <!--Abrindo o componente textarea que, por sua vez, conterá
            os elementos que serão visualizados e executados na página.-->
            <textarea name="fonte" cols="70" rows="20">
                <!DOCTYPE html>
                <html lang="pt-br">
                
                <head>
                  <meta charset="UTF-8" />
                  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
                  <title>Número aleatório</title>
                  <link rel="stylesheet" href="./css/style.css" />
                </head>
                <header>
                  <h1>While;Do</h1>
                </header>
                
                <body>
                  <h1>Descubra o Número aleatório de 0 a 10 </h1>
                  <form action="#" method="get">
                    <fieldset class="cadbasico">
                      <legend>Entrada de Dados</legend>
                      <button type="submit" id="botao">Enviar </button>
                      <button type="button" onclick="window.location.reload()">Voltar</button>

                    </fieldset>
                  </form>
                </body>
                
                </html>
                
                <!--CSS Da Página-->
                <style>
                  section {
                    margin-top: 0px auto;
                  }
                
                  .cadbasico {
                    width: 300px;
                    margin: 0px auto;
                    font-weight: bold;
                    margin-bottom: 10px;
                  }
                
                  .cadbasico input {
                    margin: 5px auto;
                    width: 100%;
                    padding: 5px 0;
                  }
                
                  .cadbasico button {
                    width: 30%;
                    background-color: #b1ccf5;
                    font-weight: bold;
                    font-size: 16px;
                  }
                
                  label {
                    float: left;
                  }
                
                  h1 {
                    text-align: center;
                    margin-top: 0px;
                    margin-bottom: 10px;
                    font-size: 50px;
                  }
                
                  h2 {
                    text-align: center;
                    margin-top: 0px;
                    margin-bottom: 10px;
                    font-size: 25px;
                  }
                
                  header {
                    display: flex;
                    font: bold 20px Arial, Helvetica, sans-serif;
                    background-color: blue;
                    color: white;
                  }
                </style>
                
                <!-- Script da Pagina -->
                
                <script>
                  function adivinhar() {
                    let tentativas = 5
                    const numeroaleatorio = Math.floor(Math.random() * 11)
                    let resposta = -1
                
                    while (tentativas !== 0 && numeroaleatorio !== resposta) {
                      resposta = Number(prompt(`Você possui ${tentativas} Tentativas. Digite o Número Aleatório`))
                      if (resposta !== numeroaleatorio) {
                        tentativas = tentativas - 1
                        alert(`Você errou e possui ${tentativas} tentativas restantes`);
                      } else {
                        alert(`Você Acertou!!!, o Numero aleatório era: ${numeroaleatorio}`)
                      }
                      if (tentativas == 0) {
                        alert("VOCE PERDEU")
                
                      }
                
                
                    }
                  }
                
                
                  botao = document.getElementById("botao");
                  botao.addEventListener("click", adivinhar);
                
                </script>

            </textarea><!--Finalizando o componente textarea-->
            <br><br>
            <input type="button" value="Testar sua página" onclick="document.write(fonte.value);"> 
            <input type="button" value="Voltar" onclick="history.back()">

       </form>


       </center>

</body><!--Finalizando a tag body da página principal-->
